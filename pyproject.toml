[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-research"
version = "0.2.0"
description = "HERMES research code and benchmark adapters"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "litellm>=1.92,<2",
    "datasets>=4.0",
    "swebench>=4.0",
]

[project.optional-dependencies]
# Only the Bedrock backend needs this; --vllm and --ollama do not.
bedrock = ["boto3>=1.40"]
harbor = ["harbor==0.23.0"]
hosted = ["openai>=2,<3", "anthropic>=1,<2"]

[tool.setuptools]
packages = ["hermes"]
